[package]
name = "transportbench-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
bytes = "1.11"
csv = "1.4"
futures-util = "0.3"
h2 = "0.4"
http = "1.3"
libc = "0.2"
mio = { version = "1.2", features = ["net", "os-poll"] }
quiche = "0.28"
rcgen = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
tokio = { version = "1.48", features = ["full"] }
tokio-rustls = "0.26"
